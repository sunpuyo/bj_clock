<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정적인 웹사이트</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            filter: brightness(50%);
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .overlay.fade-out {
            opacity: 0.4;
        }
        .clock-container {
            position: absolute;
            color: white;
            text-align: right;
        }
        .clock {
            font-size: 380px;
            font-family: Helvetica, Arial, sans-serif;
            font-weight: bold;
            letter-spacing: 10px;
            color: #e0e0e0;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.3);
        }
        .date {
            font-size: 100px;
            font-family: Helvetica, Arial, sans-serif;
            font-weight: bold;
            color: #e0e0e0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .weather-icon {
            font-size: 100px;
            color: #e0e0e0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <div class="background" id="background"></div>
    <div class="overlay" id="overlay"></div>
    <div class="clock-container" id="clock-container">
        <div class="clock" id="clock"></div>
        <div class="date" id="date">
            <span id="date-text"></span>
            <div id="weather-icon" class="weather-icon"></div>
        </div>
    </div>
    <script>
        const baseUrl = 'https://picsum.photos/1920/1080?random=';

        const weatherIcons = {
            'clear': {
                day: '☀️',
                night: '🌕'
            },
            'partlycloudy': {
                day: '⛅',
                night: '🌑'
            },
            'cloudy': {
                day: '☁️',
                night: '☁️'
            },
            'rain': {
                day: '🌧️',
                night: '🌧️'
            },
            'snow': {
                day: '🌨️',
                night: '🌨️'
            },
            'default': {
                day: '🌤️',
                night: '🌙'
            }
        };

        function getRandomNumber(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function updateBackground() {
            const background = document.getElementById('background');
            const overlay = document.getElementById('overlay');
            const randomNum = getRandomNumber(1, 100);
            const urlWithRandom = `${baseUrl}${randomNum}`;

            // 새로운 이미지를 로드할 임시 이미지 객체 생성
            const tempImage = new Image();
            tempImage.src = urlWithRandom;
            tempImage.onload = () => {
                // 페이드 아웃 효과 적용
                overlay.classList.add('fade-out');

                // 페이드 아웃이 완료된 후에 배경 이미지 교체 및 시계 위치 업데이트
                setTimeout(() => {
                    // 새로운 이미지를 배경으로 설정
                    background.style.backgroundImage = `url(${urlWithRandom})`;

                    // 시계의 위치를 랜덤하게 설정
                    const clockContainer = document.getElementById('clock-container');
                    const margin = 100; 
                    const maxTop = window.innerHeight - clockContainer.offsetHeight - margin;
                    const maxLeft = window.innerWidth - clockContainer.offsetWidth - margin;
                    const randomTop = getRandomNumber(margin, maxTop);
                    const randomLeft = getRandomNumber(margin, maxLeft);
                    clockContainer.style.top = `${randomTop}px`;
                    clockContainer.style.left = `${randomLeft}px`;

                    // 페이드 인 효과 적용
                    overlay.classList.remove('fade-out');
                }, 1000); // 페이드 아웃 효과의 지속 시간을 여기에 맞춰 설정
            };
        }

        async function getWeatherData() {
          try {
              // 동탄 좌표 사용
              const response = await fetch(
                  'https://api.open-meteo.com/v1/forecast?' +
                  'latitude=37.2025&longitude=127.0701' +
                  '&current=temperature,weather_code' +
                  '&timezone=Asia%2FTokyo'
              );
              const data = await response.json();
              return data;
          } catch (error) {
              console.error('날씨 정보를 가져오는데 실패했습니다:', error);
              return null;
          }
        }

        function getWeatherIcon(weatherCode) {
            // WMO Weather interpretation codes
            if (weatherCode === 0) return 'clear';  // 맑음
            if (weatherCode === 1 || weatherCode === 2) return 'partlycloudy';  // 대체로 맑음
            if (weatherCode === 3) return 'cloudy';  // 흐림
            if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(weatherCode)) return 'rain';  // 비
            if ([71, 73, 75, 77, 85, 86].includes(weatherCode)) return 'snow';  // 눈
            return 'default';
        }

        async function updateTime() {
            const clockElement = document.getElementById('clock');
            const dateTextElement = document.getElementById('date-text');
            const weatherIconElement = document.getElementById('weather-icon');
            const now = new Date();
            
            let hours = now.getHours().toString().padStart(2, '0');
            hours = hours % 12;
            hours = hours ? hours : 12; // 0시를 12시로 변환
    
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            clockElement.textContent = `${hours}:${minutes}`;
            
            const day = now.toLocaleDateString('ko-KR', {
                month: '2-digit', 
                day: '2-digit', 
                weekday: 'short'
            }).replace(/[\(\)]/g, ''); // 괄호 제거
            dateTextElement.textContent = day;
            
            // 날씨 정보 업데이트 (1시간마다)
            if (!weatherIconElement.dataset.lastUpdate || 
                Date.now() - parseInt(weatherIconElement.dataset.lastUpdate) > 3600000) {
                const weatherData = await getWeatherData();
                if (weatherData) {
                    const weatherCode = weatherData.current.weather_code;
                    const weatherType = getWeatherIcon(weatherCode);
                    const isDay = new Date().getHours() >= 6 && new Date().getHours() < 18;
                    const timeOfDay = isDay ? 'day' : 'night';
                    const weatherIcon = weatherIcons[weatherType][timeOfDay];
                    const temp = Math.round(weatherData.current.temperature);
                    weatherIconElement.textContent = `${weatherIcon} ${temp}°`;
                    weatherIconElement.dataset.lastUpdate = Date.now().toString();
                }
            }
        }

        setInterval(updateBackground, 10 * 60 * 1000); // 10분마다 배경화면 변경
        setInterval(updateTime, 1000); // 시계 1초마다 갱신

        document.addEventListener("DOMContentLoaded", () => {
            updateBackground();
            updateTime();
        });
    </script>
</body>
</html>
